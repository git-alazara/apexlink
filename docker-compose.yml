services:
  postgres:
    image: postgres:17-alpine
    container_name: apex-link-postgres
    environment:
      POSTGRES_DB: apexlink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_change_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - apex-link-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apexlink"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  apex-link-postgres-data:
